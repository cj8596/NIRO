<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reels | NIRO</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="loader" id="loader">
    <h1>NIRO</h1>
  </div>
  <header class="topbar">
    <a class="brand" href="index.html">NIRO</a>
    <nav class="main-nav">
      <a class="nav-link" href="index.html">HOME</a><a class="nav-link active" href="reels.html">REELS</a><a
        class="nav-link" href="books.html">BOOKS</a>
        <!-- <a class="nav-link" href="photos.html">PHOTOS</a> -->
    </nav>
    <div class="top-actions">
      <button class="login-memory" onclick="openLogin()">LOGIN TO MEMORIES</button>
      <div class="niro-profile couple-profile hidden"><img src="assets/niro-profile.jpg" alt="NIRO profile"></div>
      <span class="role-label hidden">NIRO</span><button class="logout-button hidden" onclick="logout()">LOGOUT</button>
    </div>
  </header>
  <main>
    <section class="page-intro">
      <p class="eyebrow">MOVING MEMORIES</p>
      <h1>Reels</h1>
      <p class="page-description">Little moments that deserve to be played again.</p>
    </section>
    <div class="filters" id="reelFilters">
      <button class="filter-button active" data-filter="all">All Videos</button>
      <button class="filter-button" data-filter="trips">Trips</button>
      <button class="filter-button couple-only" data-filter="dates">Dates</button>
      <button class="filter-button couple-only" data-filter="dances">Dances</button>
    </div>
    <section class="shelf">
      <div class="shelf-track" id="reelsTrack"></div>
    </section>
  </main>
  <footer class="footer"><span>Made of moments and memories.</span><span class="footer-brand">NIRO</span></footer>
  <div class="login-modal hidden" id="loginModal">
    <div class="login-card">
      <button class="login-close" onclick="closeLogin()">×</button>
      <div class="brand">NIRO</div>
      <h2>Welcome back.</h2>
      <p>Your memories are waiting.</p>
      <form id="loginForm"><label for="username">USERNAME</label><input id="username" autocomplete="username"
          required><label for="password">PASSWORD</label><input id="password" type="password"
          autocomplete="current-password" required><span class="login-error" id="loginError"></span><button
          class="login-submit" type="submit">ENTER MEMORIES</button></form>
    </div>
  </div>
  <div class="viewer hidden" id="viewer"><button class="viewer-close" onclick="closeViewer()">×</button>
    <div id="viewerContent"></div>
  </div>
  <script src="media-data.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const track = document.getElementById("reelsTrack");
      const isCouple = sessionStorage.getItem("niroLoggedIn") === "true";
      const items = NIRO_MEDIA.reels.filter(item => isCouple || item.visibility !== "couple");
      function display(filter = "all") {
        track.replaceChildren();
        items.filter(item => filter === "all" || item.category === filter)
          .forEach(item => track.appendChild(createCard(item)));
      }
      display();
      document.querySelectorAll("#reelFilters [data-filter]").forEach(button => {
        button.addEventListener("click", () => {
          document.querySelectorAll("#reelFilters .filter-button").forEach(b => b.classList.toggle("active", b === button));
          display(button.dataset.filter);
        });
      });
    });
  </script>
</body>

</html>
